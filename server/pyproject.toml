[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiserver"
version = "0.12.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.135.1", "uvicorn==0.42.0", "pydantic==2.12.3", "Pillow==11.0.0", "jsonschema==4.26.0", "httpx==0.28.1", "tokenizers==0.22.2", "gguf==0.19.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aiserver.storage" = ["*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
